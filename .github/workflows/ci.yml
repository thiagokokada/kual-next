name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Run host tests
        run: nix develop --command make test

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install Kindle toolchain
        run: nix develop --command make toolchain
      - name: Build and verify package
        run: nix develop --command make package
      - name: Upload Kindle package
        uses: actions/upload-artifact@v7
        with:
          name: kual-next-kindlehf
          path: dist/kual-next-*-kindlehf.zip
          if-no-files-found: error
          retention-days: 14
