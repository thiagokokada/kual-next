name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, such as v0.2.0; created if missing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.validate.outputs.version }}
      release_commit: ${{ steps.validate.outputs.release_commit }}
      tag_exists: ${{ steps.validate.outputs.tag_exists }}
    steps:
      - name: Check out release definitions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Validate release tag
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sh scripts/validate-release-tag.sh "$RELEASE_TAG" origin/main)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG." >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" \
            >/dev/null 2>&1; then
            tag_exists=true
            release_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          else
            tag_exists=false
            release_commit=$(git rev-parse "origin/main^{commit}")
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'release_commit=%s\n' "$release_commit"
            printf 'tag_exists=%s\n' "$tag_exists"
          } >>"$GITHUB_OUTPUT"
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.validate.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install Kindle toolchain
        run: nix develop --command make toolchain
      - name: Build and verify package
        run: nix develop --command make package
      - name: Create package checksum
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          package="kual-next-$VERSION-kindlehf.zip"
          cd dist
          sha256sum "$package" >"$package.sha256"
      - name: Preserve release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.tag }}
          path: |
            dist/kual-next-${{ steps.validate.outputs.version }}-kindlehf.zip
            dist/kual-next-${{ steps.validate.outputs.version }}-kindlehf.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-${{ inputs.tag }}
          path: release-assets
      - name: Create missing release tag
        if: needs.build.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_COMMIT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          package="release-assets/kual-next-$VERSION-kindlehf.zip"
          checksum="$package.sha256"
          gh release create "$RELEASE_TAG" "$package" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KUAL Next $VERSION" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits
