name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.validate.outputs.version }}
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_commit: ${{ steps.validate.outputs.release_commit }}
    steps:
      - name: Check out release definitions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Validate release version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(git show origin/main:VERSION)
          RELEASE_TAG="v$version"
          version=$(sh scripts/validate-release-tag.sh "$RELEASE_TAG" origin/main)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG." >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" \
            >/dev/null 2>&1; then
            echo "Git tag $RELEASE_TAG already exists." >&2
            exit 1
          fi
          release_commit=$(git rev-parse "origin/main^{commit}")
          {
            printf 'version=%s\n' "$version"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'release_commit=%s\n' "$release_commit"
          } >>"$GITHUB_OUTPUT"
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.validate.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install Kindle toolchain
        run: nix develop --command make toolchain
      - name: Build and verify package
        run: nix develop --command make package
      - name: Create package checksum
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          package="kual-next-$VERSION-kindlehf.zip"
          cd dist
          sha256sum "$package" >"$package.sha256"
      - name: Preserve release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.validate.outputs.release_tag }}
          path: |
            dist/kual-next-${{ steps.validate.outputs.version }}-kindlehf.zip
            dist/kual-next-${{ steps.validate.outputs.version }}-kindlehf.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.release_tag }}
          path: release-assets
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_COMMIT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          package="release-assets/kual-next-$VERSION-kindlehf.zip"
          checksum="$package.sha256"
          gh release create "$RELEASE_TAG" "$package" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KUAL Next $VERSION" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits
